# <twb> TIR daemons where there is a default config (baked into the code as .c code) and then
#       another default config (shipped by upstream in /etc) and then
#       another default config (shipped by Debian in /etc)
# <axhn> Shouldn't that be somewhere in /usr nowadays?
# <twb> YES!
#       Right now the context is that Debian ships glibc's nscd
#       with its default config file, which is (afaict) FUNDAMENTALLY wrong, because
#       it enables caching for hosts that ignores DNS TTL.
#       I guess it might be OK if you're living in a weird dimension where
#       all your host name resolution happens in /etc/hosts and NIS.
#       So anyway, I didn't want to try to patch the config file in a proprietary format
#       (sigh, see augeas), and
#       I don't want to ship a full copy-paste-edited version of Debian's one.
#       I want to ship a minimal config that uses defaults as much as possible.
#       Which means I have to go dig out from the C code the nscd/connections.c:struct database_dyn dbs[lastdb] = ...
#       And even then I'm not sure where some of the global settings like debug-level are defaulted in the config.
#       Also: running "nscd --debug --debug --debug --debug" with an nscd.conf of "debug-level 999"
#       doesn't actually make it tell you how it is configured.
#       That is, there's no equivalent of systemctl show.
#       Ah, and the reason the manpage is out of date is because
#       upstream doesn't provide one so Debian has a stale on in debian/local/.
#       Weird.  Testing glibc nscd's DNS caching,
#       "getent hosts example.com" doesn't cache the DNS record, but
#       "ping example.com" does.
#       Ah, OK, once nscd --foreground is running,
#       "nscd --statistics" effectively tells you the as-parsed config.

# <waldi> on the other side, nscd, isn't that dead
# <twb> If you run sssd then yes, because sssd does its job.
#       Although I still saw a 50x speedup for a
#       libnss_files.so-only system,
#       for a pathological test case [see below].
#       That test is a synthetic version of something
#       I actually ran into in the real world.

# Is nscd better than unscd at this point?
# With PrisonPC LDAP hooked up, and our nscd.conf (caching passwd/group only).
#
#     root@desktop:~# mkdir /test
#     root@desktop:~# for i in {1..10000}; do install -o 12345 -g 54321 /bin/true /test/$i; done
#     # With no caching
#     root@desktop:~# time find /test '(' -nouser -o -nogroup ')' -printf ''
#     ^C  # I gave up waiting
#     2m7.570s
#     root@main:~# systemctl start nscd
#     0m2.649s (cold cache)
#     0m1.851s (hot cache)
#     root@main:~# apt install unscd
#     root@main:~# time find /test '(' -nouser -o -nogroup ')' -printf ''
#     0m2.388s (cold cache)
#     0m2.408s (hot cache)
#     # Let's try the stock *Debian* nscd config and see if that's significantly faster...
#     root@main:~# apt purge unscd nscd  # removes our /etc/nscd.conf
#     root@main:~# apt purge nscd        # gets Debian's /etc/nscd.conf
#     root@main:~# time find /test '(' -nouser -o -nogroup ')' -printf ''
#     real    0m0.169s (cold cache)
#     real    0m0.092s (hot cache)
#
# OK, wow, so shared memory or something is SIGNIFICANTLY helping the speed?
# That's really interesting to see...


# By default Debian unscd drops privileges and upstream/Debian glibc does not.
# Their argument is "you might run a shitty nss driver that needs root".
# We don't; fuck that; drop privileges.
# FIXME: do this also/instead in systemd.
# NOTE: there is also "statistics-user X" but uid 0 (root) is always implicitly included, so leave that unspecified.
#server-user nscd


# With no nscd.conf, none of the tables are cached.
# You MUST have an nscd.conf and you MUST opt-in per table.
# NOTE: unlike Debian glibc nscd, DO NOT cache hosts at all.
# Firstly because systemd-resolved is already running and doing a good job of caching there.
# Secondly because this ignores DNS TTL (I *think*), so would cache wrongly.
# PS: also turn on caching for services just because meh, might as well (services table is "https" <-> 443).
enable-cache passwd yes
enable-cache group yes
enable-cache services yes


# By default glibc nscd caches hits for 1 hour (postimeout = 3600) and misses for 20 seconds (negtimeout = 20).
# By default Debian glibc nscd caches hits for 10 minutes (= 600) for users, and the rest as default.
# By default Debian unscd is the same as Debian nscd.
# We really just want to reduce the rate of idential queries from 1000/s to 1/s.
# I think for users 1 hour is excessive and 10 minutes is FineTM.
# In practice it *probably* doesn't matter because our desktops are all logout-is-reboot. --twb, April 2026
positive-time-to-live passwd 600


# This MASSIVELY improves performance (10K negative queries take 90ms instead of 1850ms), but reduces security?
# This reduces security and increases performance, I guess?
# Do we want this?
# This is not supported by unscd or systemd-resolved.
# I am pretty skeptical about whether we want this for glibc nscd.
# It is off by default in upstream glibc nscd.
# It is on by default in Debian glibc nscd.
shared passwd yes
shared group yes
shared services yes


# The upstream glibc nscd and Debian glibc nscd default cache size is 211.
# The unscd default cache size is 1001.
# The Debian-written manpage says it must be a prime number (wat?)
# The Debian-written manpage says it should be bigger than the number of records you expect to cache concurrently.
# Since we have like ~2500 users already in LDAP, I think we should set this to around 5000? --twb, April 2026
# https://en.wikipedia.org/wiki/List_of_prime_numbers
# But if I actually try that then it complains:
#   suggested size of table for database passwd larger than the persistent database's table
# and it does that even if I set max-db-size to 2²⁵ like debian glibc does
# ACTUALLY – this is only a problem if persistence is enabled and you run it with one suggested-size, THEN increase it.
# If you stop nscd, rm /var/cache/nscd/*, then start it up again, it is totally fine with this.
# And your file size for the persistent file grows from 217032 to 5139096 which is still pretty negligible.
# We really give zero shits about persistent caching (across nscd restart) in /var/cache/nscd/.
# See also paranoia which we also do not care about, because
# our nss drivers do not do legacy dumb shit like PADL LDAP driver used to.
# Honestly we could probably just leave this at 211 and probably be OK
# anyway because 99% of the time you're gonna be asking for the same
# user 1000 times in a row and that's what we want to mitigate.
# suggested size of 211 = ~200KiB cache
# suggested size of 499 = ~5MiB cache
suggested-size passwd 4999
