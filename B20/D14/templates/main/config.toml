include = [
    # Vital packages
    'live-boot',
    # update-initramfs: Generating /boot/initrd.img-7.1.7+deb14-amd64
    # mkinitramfs: copy_file: binary '/sbin/losetup' not found
    # $ apt-file search bin/losetup ==> klibc-utils: /usr/lib/klibc/bin/losetup; mount: /usr/sbin/losetup
    # Prior to Debian 14, systemd--depends-->mount was keeping mount installed:
    # "* systemd: downgrade systemd-tpm and mount to recommends." --bluca, 13 Jul 2026
    'mount',                    # needed for live-boot now I guess???
    'init',                     # https://bugs.debian.org/993289
    'zstd',                     # for initramfs-tools-core
    'netbase',                  # https://bugs.debian.org/995343 et al
    'systemd-timesyncd',        # https://bugs.debian.org/986651
    'dbus-broker',              # https://bugs.debian.org/814758
    'ca-certificates',
    'publicsuffix',
    'linux-sysctl-defaults',    # https://alloc.cyber.com.au/task/task.php?taskID=35711
    # FIXME: for shitty reasons, PrisonPC does "getent passwd" in /lib/systemd/system-generators/.
    #        If nsswitch.conf says "files: passwd ldap" this is fast enough.
    #        If nsswitch.conf says "files: passwd systemd ldap" this takes an extra 45 seconds.
    #        Since libnsswitch-systemd functionality is "nice to have", just stop installing it.
    #        --twb, May 2026
    #        https://alloc.cyber.com.au/task/task.php?taskID=35749
    # 'libnss-systemd',
    'debian-security-support',  # for customize90-check-support-status.py

    # Make things work better with systemd-networkd
    'libnss-myhostname',        # replaces /etc/hostname and stub /etc/hosts
    'libnss-resolve',
    'systemd-resolved',  # libnss-resolved → systemd-resolved is only Recommends in Debian 14+
    # NOTE: in Debian 12, "policykit-1" was split into two packages
    #       "pkexec" (not used except by attackers) and
    #       "polkitd" (used by systemd-hostnamed, udisks2, upower, &c).
    'polkitd',        # https://github.com/openbmc/openbmc/issues/3543

    # zram is not strictly necessary, but as at 2025, the general
    # consensus is that "a little swap always helps, even if it's just
    # compressed RAM".
    # https://alloc.cyber.com.au/task/task.php?taskID=35532
    # https://web.archive.org/web/20241124120147/https://social.treehouse.systems/@marcan/113528611033546817
    # https://discussion.fedoraproject.org/t/psa-transitioning-from-zram-swap-to-zswap/138256
    # (Note Asahi had BOTH zram AND swap concurrently; now they have
    # zswap alone.  Do not misread that page as "zram is bad", rather
    # "zswap is better than zram IFF you have a local disk".)
    #
    # We use a helper package to do this for us.
    # The setup process is really simple (~5 commands).
    # But we might as well leverage someone else's answer.
    # As at D12, Debian Security Team cannot provide security updates for rustlang,
    # so we also have to accept-the-risk in customize90-check-support-status.grepF.
    # --twb, August 2025
    #
    # https://github.com/systemd/zram-generator
    # https://docs.kernel.org/admin-guide/blockdev/zram.html#activate
    # systemd-zram-generator defaults to min(<half total RAM>, 4GB) as
    # LZ4-compressed swap.  This typically means 2GB RAM actual acts
    # like 2.4GB RAM effective.
    "systemd-zram-generator",

    # Force old C cpio (not new rustlang 3cpio).
    # As at May 2026, there are two reasons for this:
    #
    #  1. amd64-microcode's initramfs-tools hook specifically requires GNU cpio.
    #
    #         https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1136383
    #
    #  2. debian-security-support supports sqv, but not 3cpio;
    #
    #         https://salsa.debian.org/debian/debian-security-support/-/blob/1%2514+2026.05.07/security-support.deb14?ref_type=tags#L40-41
    #
    #         $ mmdebstrap forky /dev/null --quiet --include=linux-image-generic,debian-security-support --customize-hook='chroot $1 check-support-status' --variant=apt
    #         [3cpio is installed; check-support-status whinges]
    #         $ mmdebstrap forky /dev/null --quiet --include=linux-image-generic,debian-security-support --customize-hook='chroot $1 check-support-status'
    #         [cpio is installed; no errors]
    #
    # FIXME: remove this once both issues are resolved.
    "cpio",
]
