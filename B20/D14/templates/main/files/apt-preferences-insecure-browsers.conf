
Explanation:
  Refuse to install any browser engines that Debian Security do not support...
  The purpose of this is to avoid ACCIDENTALLY installing an app
  that INDIRECTLY pulls in an insecure browser engine.
  For example KDE5 KNewStuff framework could de facto use a browser
  engine to render attacker-supplied content.
  .
  We do not shitlist things that gnome/firefox/chromium need, sigh.
  This file primarily targets Debian 13/14 (trixie/forky), but
  keeps some old entries for backcompat "better than nothing" on old releases.
  .
  WARNING WARNING WARNING:
      If you already have a matching package already installed,
      this WILL NOT uninstall it; and
      this WILL prevent updates (including security updates) to it.
      This WILL NOT prevent manual install with
      e.g. "apt install foo/stable" or "apt install foo=1.0".
      This WILL NOT prevent interactive  install via aptitude.
      ("aptitude install foo" WILL warn you.)
  .
  Debian Security Team only supports for the browser engines of
  firefox-esr and (while feasible) chromium.
  You should assume all other browser engines are insecure in Debian.
  .
  https://web.archive.org/web/20191227000923/https://www.debian.org/releases/buster//amd64/release-notes/ch-information.en.html#browser-security
  NOTE: Definitely do "apt install debian-security-support && check-support-status".
        However this only warns you AFTER the package is installed.
        Also if you are building containers and the host/guest are different Debian releases,
        you cannot check the guest using the host debian-security-support, because
        the rules are specific to a release and old packages are removed promptly.
        (So not backwards compatible either.)
  .
  NOTE: firefox-esr is in stable and unstable and is supported.
        fireox (no -esr) is in unstable only and is not supported?
  Things that should be on this list but are not:
      src:libsoup2.4 -- blame gnome as at Debian 13 -- https://gitlab.gnome.org/GNOME/libsoup/-/commit/2a9d8ecc45bb814f6a81b1241e6c0c55d632aa28
      src:libsoup3   -- blame gnome as at Debian 13 -- https://gitlab.gnome.org/GNOME/libsoup/-/commit/2a9d8ecc45bb814f6a81b1241e6c0c55d632aa28
      src:gjs        -- blame gnome as at Debian 13 -- supported by Debian Security Team?
      src:webkit2gtk -- blame gnome as at Debian 13 -- supported by Debian Security Team SOMETIMES (like chromium)?
      src:chromium                                  -- supported by Debian Security Team SOMETIMES
      src:firefox-esr                               -- supported by Debian Security Team
